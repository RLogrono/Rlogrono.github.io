name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML files
        run: |
          echo "✓ Validando archivos HTML..."
          if command -v html-validate &> /dev/null; then
            html-validate index.html
          else
            echo "⚠️ html-validate no instalado, validación manual..."
            # Verificar que exista el archivo principal
            if [ ! -f "index.html" ]; then
              echo "❌ Error: index.html no encontrado"
              exit 1
            fi
            echo "✓ index.html existe"
          fi

      - name: Verify required files
        run: |
          echo "📋 Verificando archivos requeridos..."
          files=("index.html" "css/styles.css" "js/script.js" "bornco.jpg")
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file encontrado"
            else
              echo "⚠️ Advertencia: $file no encontrado"
            fi
          done

      - name: Generate build info
        run: |
          echo "🔨 Generando información del build..."
          echo "Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt
          echo "Actor: ${{ github.actor }}" >> build-info.txt
          cat build-info.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment success
        run: |
          echo "🚀 ¡Despliegue completado exitosamente!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
